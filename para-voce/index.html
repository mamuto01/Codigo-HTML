<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
<title>Para a minha princesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: uma tela de app por vez, empilhadas. O jogo ocupa a tela toda; carta e foto rolam no centro.
     Visual único e claro de propósito: leite de morango, lavanda e papel. */
  :root {
    --leite: #fff2f6;
    --leite-2: #ffe3ec;
    --papel: #fffdf9;
    --morango: #ff6f96;
    --morango-esc: #e04d79;
    --rosa-suave: #ffc4d5;
    --lavanda: #c9b6ff;
    --mel: #ffc24a;
    --ameixa: #5e3550;
    --ameixa-suave: #946c84;
    --sombra: rgba(94, 53, 80, .14);

    --f-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
    --f-corpo: "Nunito", ui-rounded, system-ui, sans-serif;
    --f-mao: "Caveat", "Segoe Print", "Bradley Hand", cursive;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--leite);
    color: var(--ameixa);
    font-family: var(--f-corpo);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 12% 8%, #ffd3e2 0, transparent 38%),
      radial-gradient(circle at 92% 88%, #e9e0ff 0, transparent 42%),
      radial-gradient(rgba(255, 111, 150, .16) 1.3px, transparent 1.6px) 0 0 / 22px 22px;
  }

  #app { position: relative; height: 100%; }
  .tela { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .rolagem {
    height: 100%;
    overflow-y: auto;
    padding-block: 64px 40px;
    padding-inline: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .centro { justify-content: center; text-align: center; }

  h1, .display { font-family: var(--f-display); text-wrap: balance; }

  .btn {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 1.15rem;
    color: #fff;
    background: var(--morango);
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--morango-esc), 0 14px 26px rgba(255, 111, 150, .28);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--morango-esc), 0 6px 12px rgba(255, 111, 150, .25); }
  .btn:focus-visible, .link:focus-visible, .som:focus-visible { outline: 3px solid var(--lavanda); outline-offset: 3px; }
  .link {
    background: none;
    border: none;
    font: 700 .95rem var(--f-corpo);
    color: var(--ameixa-suave);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 8px;
  }

  .som {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 14px;
    z-index: 40;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--rosa-suave);
    background: var(--papel);
    color: var(--ameixa);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--sombra);
  }

  /* ---------- Abertura ---------- */
  .intro { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .olho {
    font: 800 .78rem var(--f-corpo);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--morango-esc);
    margin: 0;
  }
  .intro h1 {
    margin: 0;
    font-size: clamp(2.5rem, 11vw, 3.6rem);
    line-height: 1.05;
    font-weight: 700;
  }
  .princesa { position: relative; color: var(--morango); display: inline-block; }
  .princesa svg {
    position: absolute;
    width: .9em;
    top: -.42em;
    right: -.38em;
    transform: rotate(20deg);
  }
  .intro-sub { margin: 0; font-size: 1.08rem; line-height: 1.55; color: var(--ameixa-suave); }
  .pote-intro { width: 132px; height: 150px; animation: balanca 3s ease-in-out infinite; }
  @keyframes balanca { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-6px); } }
  .dica-som { margin: 0; font-size: .85rem; color: var(--ameixa-suave); }

  .flutua {
    position: absolute;
    color: var(--rosa-suave);
    pointer-events: none;
    animation: sobe-lento 9s linear infinite;
    bottom: -40px;
  }
  @keyframes sobe-lento {
    from { transform: translateY(0) rotate(-10deg); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-115vh) rotate(14deg); opacity: 0; }
  }

  /* ---------- Jogo ---------- */
  #tela-jogo { touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 72px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    z-index: 5;
  }
  .hud-linha { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hud-titulo { font: 600 1rem var(--f-display); }
  .hud-pct { font: 800 .85rem var(--f-corpo); font-variant-numeric: tabular-nums; color: var(--morango-esc); }
  .medidor {
    height: 16px;
    border-radius: 999px;
    background: var(--papel);
    border: 2px solid var(--rosa-suave);
    overflow: hidden;
  }
  .medidor-cheio {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--lavanda), var(--morango));
    transition: width .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .combo {
    align-self: flex-start;
    font: 700 .85rem var(--f-display);
    color: #fff;
    background: var(--lavanda);
    padding: 3px 12px;
    border-radius: 999px;
    opacity: 0;
    transform: scale(.6);
    transition: opacity .2s, transform .2s cubic-bezier(.3, 1.8, .5, 1);
  }
  .combo.on { opacity: 1; transform: scale(1); }
  .combo.quente { background: var(--morango); }

  .bilhete {
    position: absolute;
    top: 104px;
    left: 50%;
    width: min(calc(100% - 40px), 360px);
    background: var(--papel);
    border-radius: 14px;
    padding: 18px 18px 14px;
    box-shadow: 0 14px 30px var(--sombra);
    text-align: center;
    pointer-events: none;
    z-index: 6;
    transform: translateX(-50%) rotate(-2deg);
  }
  .bilhete::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    width: 84px;
    height: 20px;
    transform: translateX(-50%) rotate(3deg);
    background: rgba(201, 182, 255, .75);
    border-radius: 3px;
  }
  .bilhete-n { font: 800 .7rem var(--f-corpo); letter-spacing: .12em; text-transform: uppercase; color: var(--ameixa-suave); margin: 0 0 4px; }
  .bilhete-t { font: 700 1.75rem/1.15 var(--f-mao); margin: 0; color: var(--ameixa); }
  .bilhete.entra { animation: bilhete-in .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  .bilhete.sai { animation: bilhete-out .3s ease-in both; }
  @keyframes bilhete-in { from { opacity: 0; transform: translateX(-50%) translateY(-24px) rotate(-8deg) scale(.8); } }
  @keyframes bilhete-out { to { opacity: 0; transform: translateX(-50%) translateY(-16px) rotate(2deg) scale(.9); } }

  .tutorial {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: min(calc(100% - 40px), 330px);
    background: var(--papel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 14px 34px var(--sombra);
    text-align: center;
    z-index: 7;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tutorial h2 { margin: 0; font: 600 1.3rem var(--f-display); }
  .tutorial ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; font-size: .95rem; }
  .tutorial li { display: flex; gap: 10px; align-items: center; }
  .tutorial .ic { width: 28px; text-align: center; font-size: 1.2rem; flex: none; }
  .mao { font-size: 2rem; animation: arrasta 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes arrasta { 0%, 100% { transform: translateX(-34px); } 50% { transform: translateX(34px); } }
  .tutorial .toque { font: 700 .9rem var(--f-corpo); color: var(--morango-esc); margin: 0; }

  .vitoria {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    background: rgba(255, 242, 246, .72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .vit-card {
    background: var(--papel);
    border-radius: 24px;
    padding: 28px 22px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 44px var(--sombra);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    animation: pula .6s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  @keyframes pula { from { opacity: 0; transform: scale(.7) translateY(20px); } }
  .vit-frase { font: 700 2.6rem/1.05 var(--f-mao); color: var(--morango-esc); margin: 0; }
  .vit-info { margin: 0; color: var(--ameixa-suave); font-size: .95rem; font-variant-numeric: tabular-nums; }

  /* ---------- Carta ---------- */
  .carta {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: var(--papel);
    border-radius: 20px;
    padding: 40px 26px 28px;
    box-shadow: 0 18px 40px var(--sombra);
    font-family: var(--f-mao);
    font-size: 1.62rem;
    line-height: 1.3;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .carta-texto { display: flex; flex-direction: column; gap: 14px; min-height: 8em; }
  .carta p { margin: 0; }
  .digitando::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: .9em;
    margin-left: 3px;
    vertical-align: -.08em;
    background: var(--morango);
    animation: cursor .8s steps(1) infinite;
  }
  @keyframes cursor { 50% { opacity: 0; } }
  .carta-pular { margin: 0; font: 700 .85rem var(--f-corpo); color: var(--ameixa-suave); }
  .carta-ola { font-size: 2.2rem; font-weight: 700; color: var(--morango-esc); }
  .carta-ass { text-align: right; font-weight: 700; color: var(--morango-esc); white-space: pre-line; }
  .selo {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--morango);
    box-shadow: 0 4px 0 var(--morango-esc), 0 8px 16px rgba(255, 111, 150, .3);
    display: grid;
    place-items: center;
  }
  .selo svg { width: 22px; }

  /* ---------- Foto ---------- */
  .polaroid {
    margin: 0;
    background: #fff;
    padding: 12px 12px 0;
    width: min(76vw, 300px);
    max-width: 100%;
    box-shadow: 0 18px 40px var(--sombra);
    transform: rotate(-3deg);
    position: relative;
  }
  .polaroid::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    width: 96px;
    height: 24px;
    transform: translateX(-50%) rotate(-4deg);
    background: rgba(255, 196, 213, .85);
    border-radius: 3px;
  }
  .polaroid img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 35%; background: var(--leite-2); }
  .polaroid.revela img { animation: revela 3s ease both; }
  @keyframes revela { from { filter: brightness(2.4) saturate(0) blur(4px); } }
  .polaroid figcaption { font: 700 1.6rem/1 var(--f-mao); color: var(--ameixa); text-align: center; padding: 12px 0 16px; }
  .foto-legenda { font: 700 1.75rem/1.2 var(--f-mao); margin: 0; max-width: 340px; }
  .abraco { font: 600 1.15rem var(--f-display); color: var(--morango-esc); margin: 0; min-height: 1.6em; }

  .estoura {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    color: var(--morango);
    animation: estoura linear forwards;
  }
  @keyframes estoura {
    from { transform: translateY(0) rotate(0) scale(.6); opacity: 1; }
    to { transform: translateY(-105vh) rotate(30deg) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flutua, .pote-intro, .mao { animation: none; }
    .flutua { display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <button class="som" id="som" type="button" aria-label="Ligar ou desligar o som">♪</button>

  <!-- Abertura -->
  <section class="tela" id="tela-inicio">
    <div class="rolagem centro">
      <div class="intro">
        <svg class="pote-intro" viewBox="0 0 132 150" aria-hidden="true">
          <rect x="22" y="12" width="88" height="16" rx="8" fill="#ff8fb0"/>
          <path d="M28 30 h76 q10 4 10 18 v72 q0 18 -18 18 h-60 q-18 0 -18 -18 v-72 q0 -14 10 -18z" fill="#ffffff" stroke="#ffc4d5" stroke-width="3"/>
          <path d="M20 86 q23 -8 46 0 t46 0 v34 q0 16 -16 16 h-60 q-16 0 -16 -16z" fill="#ff8fb0"/>
          <circle cx="50" cy="66" r="4" fill="#5e3550"/>
          <circle cx="82" cy="66" r="4" fill="#5e3550"/>
          <path d="M58 74 q8 8 16 0" stroke="#5e3550" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="40" cy="76" rx="6" ry="3.5" fill="#ffc4d5"/>
          <ellipse cx="92" cy="76" rx="6" ry="3.5" fill="#ffc4d5"/>
          <path d="M66 112 c-6 -6 -14 -2 -14 4 c0 6 14 12 14 12 s14 -6 14 -12 c0 -6 -8 -10 -14 -4z" fill="#ffffff"/>
        </svg>
        <p class="olho" data-t="aberturaChamada"></p>
        <h1><span data-t="aberturaTitulo"></span> <span class="princesa"><span data-t="aberturaDestaque"></span><svg viewBox="0 0 40 26" aria-hidden="true"><path d="M3 22 L6 6 L14 14 L20 2 L26 14 L34 6 L37 22 Z" fill="#ffc24a" stroke="#e0a21f" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="17" r="2.6" fill="#ff6f96"/></svg></span></h1>
        <p class="intro-sub" data-t="aberturaTexto"></p>
        <button class="btn" id="btn-comecar" type="button" data-t="aberturaBotao"></button>
        <p class="dica-som" data-t="aberturaDicaSom"></p>
      </div>
    </div>
  </section>

  <!-- Jogo -->
  <section class="tela" id="tela-jogo" hidden>
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-linha">
        <span class="hud-titulo" data-t="potinho"></span>
        <span class="hud-pct" id="pct">0%</span>
      </div>
      <div class="medidor"><div class="medidor-cheio" id="medidor"></div></div>
      <span class="combo" id="combo">combo x3</span>
    </div>

    <div class="bilhete" id="bilhete" hidden>
      <p class="bilhete-n" id="bilhete-n"></p>
      <p class="bilhete-t" id="bilhete-t"></p>
    </div>

    <div class="tutorial" id="tutorial">
      <h2 data-t="tutorialTitulo"></h2>
      <ul>
        <li><span class="ic">💗</span><span data-t="tutorial.0"></span></li>
        <li><span class="ic">💛</span><span data-t="tutorial.1"></span></li>
        <li><span class="ic">🎁</span><span data-t="tutorial.2"></span></li>
        <li><span class="ic">☁️</span><span data-t="tutorial.3"></span></li>
      </ul>
      <div><span class="mao" aria-hidden="true">👆</span></div>
      <p class="toque" data-t="tutorialToque"></p>
    </div>

    <div class="vitoria" id="vitoria" hidden>
      <div class="vit-card">
        <p class="olho" data-t="vitoriaChamada"></p>
        <p class="vit-frase" id="vit-frase"></p>
        <p class="vit-info" id="vit-info"></p>
        <button class="btn" id="btn-carta" type="button" data-t="vitoriaBotao"></button>
      </div>
    </div>
  </section>

  <!-- Carta -->
  <section class="tela" id="tela-carta" hidden>
    <div class="rolagem">
      <article class="carta" id="carta">
        <span class="selo" aria-hidden="true"><svg viewBox="0 0 24 22"><path d="M12 21 C4 15 1 11 1 7 C1 3.5 3.8 1 7 1 C9.2 1 11 2.2 12 4 C13 2.2 14.8 1 17 1 C20.2 1 23 3.5 23 7 C23 11 20 15 12 21Z" fill="#fff"/></svg></span>
        <div class="carta-texto" id="carta-texto" aria-live="polite"></div>
      </article>
      <p class="carta-pular" id="carta-pular" data-t="cartaPular"></p>
      <button class="btn" id="btn-foto" type="button" data-t="cartaBotao" hidden></button>
    </div>
  </section>

  <!-- Foto -->
  <section class="tela" id="tela-foto" hidden>
    <div class="rolagem centro">
      <figure class="polaroid" id="polaroid">
        <img src="foto.jpg" alt="Nós dois juntinhos, à noite, sorrindo para a câmera">
        <figcaption data-t="fotoLegenda"></figcaption>
      </figure>
      <p class="foto-legenda" data-t="fotoTexto"></p>
      <button class="btn" id="btn-abraco" type="button" data-t="abracoBotao"></button>
      <p class="abraco" id="abraco" aria-live="polite"></p>
      <button class="link" id="btn-denovo" type="button" data-t="jogarDeNovo"></button>
    </div>
  </section>
</div>

<script>
  /* =====================================================================
     TODOS OS TEXTOS DO JOGUINHO
     É só trocar o que está entre aspas. Não apague as aspas nem as vírgulas.
     ===================================================================== */
  const TEXTOS = {
    // Tela de abertura
    aberturaChamada: "um joguinho feito pra você, Bruna",
    aberturaTitulo: "Para a minha",
    aberturaDestaque: "princesa",
    aberturaTexto: "Encha o potinho de amor e vá descobrindo os bilhetinhos que eu escrevi pra você, minha diva.",
    aberturaBotao: "Começar ♡",
    aberturaDicaSom: "Fica mais fofo com o som ligado.",

    // Como jogar
    tutorialTitulo: "Como jogar",
    tutorial: [
      "Pegue os coraçõezinhos com o potinho",
      "Os dourados valem muito mais",
      "O presente puxa os corações pra você",
      "Desvie das nuvenzinhas tristes"
    ],
    tutorialToque: "Arraste o dedo pra começar",

    // Durante o jogo
    potinho: "Potinho do amor",
    nuvem: "passa já, nuvem ☁️",
    presente: "presente! 🎁",
    bilheteNumero: "bilhetinho {n} de {total}",

    // Bilhetinhos (aparecem a cada 10% do potinho; o último aparece quando ele enche)
    frases: [
      "Obrigado pela paciência.",
      "Eu agradeço a Deus todos os dias por ter você em minha vida.",
      "Você me incentiva a ser uma pessoa melhor.",
      "Você me ajuda nos momentos difíceis.",
      "Eu aprendo muito com você.",
      "Você é o amor da minha vida.",
      "Você é a melhor pessoa deste mundo.",
      "Eu escrevi esses textos manualmente, ksks.",
      "Sei que você não gosta de IA.",
      "Eu amo muito você."
    ],

    // Potinho cheio
    vitoriaChamada: "potinho cheio!",
    vitoriaResumo: "Você pegou {coracoes} coraçõezinhos · maior combo x{combo}",
    vitoriaBotao: "Abrir a cartinha",

    // Cartinha (cada item da lista "carta" vira um parágrafo)
    cartaSaudacao: "Bruna, minha diva,",
    carta: [
      "Às vezes, tenho muita dificuldade em demonstrar o quanto você é incrível na minha vida e o quanto eu amo você.",
      "Sei que estou passando por um momento difícil, mas tenho fé em Deus de que tudo isso vai passar. E quero dar o melhor de mim por você, minha gatinha.",
      "Quero que saiba que sempre vai poder contar comigo. Sua presença me faz muito bem.",
      "Nunca se esqueça de que você é muito especial para mim."
    ],
    cartaDespedida: "Com todo o meu amor,",
    cartaAssinatura: "G. Fernandes ♡",
    cartaPular: "toque na carta para pular",
    cartaBotao: "Tem mais uma coisinha…",

    // Foto e final
    fotoLegenda: "Bruna & G. ♡",
    fotoTexto: "Eu sei que você não gosta muito dessa foto… mas eu amo ela.",
    abracoBotao: "Me dá um abraço?",
    abracoMensagem: "Abraço apertado enviado. Pode cobrar pessoalmente ♡",
    abracoDeNovo: "Outro abraço",
    jogarDeNovo: "jogar de novo"
  };
  /* ===================================================================== */

  const FRASES = TEXTOS.frases;
  const $ = (id) => document.getElementById(id);
  const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const preencher = (modelo, dados) => modelo.replace(/\{(\w+)\}/g, (m, k) => (k in dados ? dados[k] : m));
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = el.dataset.t.split(".").reduce((o, k) => (o == null ? o : o[k]), TEXTOS);
    if (typeof v === "string") el.textContent = v;
  });

  function irPara(id) {
    document.querySelectorAll(".tela").forEach((t) => { t.hidden = t.id !== id; });
  }

  /* ---------- Corações flutuando na abertura ---------- */
  (function () {
    const tela = $("tela-inicio");
    for (let i = 0; i < 12; i++) {
      const s = document.createElement("span");
      s.className = "flutua";
      s.textContent = "♥";
      s.style.left = Math.random() * 100 + "%";
      s.style.fontSize = 14 + Math.random() * 22 + "px";
      s.style.animationDelay = -Math.random() * 9 + "s";
      s.style.animationDuration = 7 + Math.random() * 6 + "s";
      tela.appendChild(s);
    }
  })();

  function chuva(qtd) {
    if (reduzir) qtd = Math.min(qtd, 8);
    const cores = ["#ff6f96", "#ff8fb0", "#c9b6ff", "#ffc24a", "#ffc4d5"];
    for (let i = 0; i < qtd; i++) {
      setTimeout(() => {
        const c = document.createElement("span");
        c.className = "estoura";
        c.textContent = "♥";
        c.style.left = Math.random() * 100 + "vw";
        c.style.bottom = "-30px";
        c.style.color = cores[i % cores.length];
        c.style.fontSize = 16 + Math.random() * 28 + "px";
        c.style.animationDuration = 2.6 + Math.random() * 2.4 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5200);
      }, i * 45);
    }
  }

  /* ---------- Som (notinhas geradas no navegador) ---------- */
  let ac = null;
  let som = true;
  function audio() {
    if (!som) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function nota(freq, dur = 0.35, vol = 0.08, tipo = "sine", atraso = 0) {
    if (!audio()) return;
    try {
      const t = ac.currentTime + atraso;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = tipo;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (e) { /* sem som, tudo bem */ }
  }
  const ESCALA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
  function arpejo(notas, passo = 0.09, dur = 0.5) { notas.forEach((f, i) => nota(f, dur, 0.07, "sine", i * passo)); }
  /* Máquina de escrever: tecla, sininho do fim da linha e o carrinho voltando */
  let ruido = null;
  function criarRuido(a) {
    if (ruido) return ruido;
    const n = Math.floor(a.sampleRate * 0.3);
    ruido = a.createBuffer(1, n, a.sampleRate);
    const d = ruido.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return ruido;
  }
  function tecla(espaco) {
    const a = audio();
    if (!a) return;
    try {
      const t = a.currentTime;
      const s = a.createBufferSource();
      s.buffer = criarRuido(a);
      s.playbackRate.value = 0.8 + Math.random() * 0.4;
      const f = a.createBiquadFilter();
      f.type = "bandpass";
      f.frequency.value = espaco ? 650 : 1500 + Math.random() * 1800;
      f.Q.value = 1;
      const g = a.createGain();
      g.gain.setValueAtTime(espaco ? 0.22 : 0.4, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      s.connect(f); f.connect(g); g.connect(a.destination);
      s.start(t, Math.random() * 0.2, 0.05);
      const o = a.createOscillator();
      const og = a.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(espaco ? 110 : 170, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.03);
      og.gain.setValueAtTime(0.09, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      o.connect(og); og.connect(a.destination);
      o.start(t);
      o.stop(t + 0.05);
    } catch (e) {}
  }
  function sininho() {
    nota(2093, 1.3, 0.045);
    nota(3136, 0.9, 0.02);
    nota(4186, 0.5, 0.012);
  }
  function carrinho() {
    const a = audio();
    if (!a) return;
    try {
      const t = a.currentTime;
      const s = a.createBufferSource();
      s.buffer = criarRuido(a);
      const f = a.createBiquadFilter();
      f.type = "bandpass";
      f.Q.value = 2;
      f.frequency.setValueAtTime(500, t);
      f.frequency.exponentialRampToValueAtTime(2200, t + 0.25);
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      s.connect(f); f.connect(g); g.connect(a.destination);
      s.start(t, 0, 0.3);
      tecla(false);
    } catch (e) {}
  }
  const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

  /* A cartinha vai sendo datilografada. Um toque na carta mostra tudo de uma vez. */
  let cartaVez = 0;
  async function escreverCarta() {
    const vez = ++cartaVez;
    const caixa = $("carta-texto");
    const rol = $("tela-carta").querySelector(".rolagem");
    caixa.textContent = "";
    $("btn-foto").hidden = true;
    $("carta-pular").hidden = false;
    let pular = reduzir;
    const aoTocar = () => { pular = true; };
    $("carta").addEventListener("pointerdown", aoTocar);

    const blocos = [
      { cls: "carta-ola", txt: TEXTOS.cartaSaudacao },
      ...TEXTOS.carta.map((txt) => ({ cls: "", txt })),
      { cls: "carta-ass", txt: TEXTOS.cartaDespedida + "\n" + TEXTOS.cartaAssinatura }
    ];
    const seguir = (el) => {
      const r = el.getBoundingClientRect();
      const limite = rol.getBoundingClientRect().bottom - 60;
      if (r.bottom > limite) rol.scrollTop += r.bottom - limite;
    };

    for (const b of blocos) {
      if (vez !== cartaVez) return;
      const p = document.createElement("p");
      if (b.cls) p.className = b.cls;
      caixa.appendChild(p);
      if (pular) { p.textContent = b.txt; continue; }
      p.classList.add("digitando");
      for (let i = 0; i < b.txt.length; i++) {
        if (vez !== cartaVez) return;
        if (pular) { p.textContent = b.txt; break; }
        const ch = b.txt[i];
        p.textContent += ch;
        if (i % 4 === 0) seguir(p);
        if (ch === "\n") { carrinho(); await esperar(320); continue; }
        tecla(ch === " ");
        await esperar(/[.,!?;:…]/.test(ch) ? 260 : ch === " " ? 70 : 38 + Math.random() * 34);
      }
      p.classList.remove("digitando");
      if (!pular) {
        sininho();
        await esperar(380);
        carrinho();
        await esperar(320);
      }
    }
    if (vez !== cartaVez) return;
    $("carta").removeEventListener("pointerdown", aoTocar);
    $("carta-pular").hidden = true;
    $("btn-foto").hidden = false;
    $("btn-foto").scrollIntoView({ behavior: reduzir ? "auto" : "smooth", block: "nearest" });
  }

  function vibrar(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  $("som").addEventListener("click", () => {
    som = !som;
    $("som").textContent = som ? "♪" : "×";
    $("som").setAttribute("aria-pressed", String(!som));
  });

  /* =====================================================================
     JOGO
     ===================================================================== */
  const cv = $("cv");
  const cx = cv.getContext("2d");
  let W = 0, H = 0, escala = 1;
  let J = null;   // o potinho
  let G = null;   // estado do jogo
  let quadro = 0;

  function medir() {
    const r = cv.getBoundingClientRect();
    W = r.width;
    H = r.height;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * d);
    cv.height = Math.round(H * d);
    cx.setTransform(d, 0, 0, d, 0, 0);
    escala = Math.max(0.85, Math.min(1.25, H / 760));
    if (J) {
      J.y = H - Math.max(92, H * 0.13);
      J.x = J.tx = Math.min(Math.max(J.x, J.w / 2), W - J.w / 2);
    }
  }
  window.addEventListener("resize", () => { if (!$("tela-jogo").hidden) medir(); });

  function novoJogo() {
    medir();
    J = { x: W / 2, tx: W / 2, y: H - Math.max(92, H * 0.13), w: 96, h: 86, feliz: 0, triste: 0, aperta: 0, brilho: 0 };
    G = {
      comecou: false, fim: false, mostrouVitoria: false,
      pontos: 0, combo: 0, maiorCombo: 0, pegos: 0,
      itens: [], parts: [], textos: [],
      acc: 0, ima: 0, tremor: 0, tempo: 0,
      desbloq: 0, fila: [], bilheteAtivo: false
    };
    $("tutorial").hidden = false;
    $("vitoria").hidden = true;
    $("bilhete").hidden = true;
    atualizarMedidor();
    atualizarCombo();
    cancelAnimationFrame(quadro);
    let ultimo = performance.now();
    const passo = (agora) => {
      const dt = Math.min(0.05, (agora - ultimo) / 1000);
      ultimo = agora;
      atualizar(dt);
      desenhar();
      quadro = requestAnimationFrame(passo);
    };
    quadro = requestAnimationFrame(passo);
  }

  /* Controles: o potinho segue o dedo (ou o mouse) em qualquer parte da tela */
  const telaJogo = $("tela-jogo");
  function mirar(e) {
    if (!J || G.fim) return;
    const r = cv.getBoundingClientRect();
    J.tx = Math.max(J.w / 2, Math.min(W - J.w / 2, e.clientX - r.left));
    if (!G.comecou && (e.type === "pointerdown" || e.pointerType === "mouse")) {
      G.comecou = true;
      $("tutorial").hidden = true;
      nota(784, 0.3);
    }
  }
  telaJogo.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    try { telaJogo.setPointerCapture(e.pointerId); } catch (err) {}
    mirar(e);
  });
  telaJogo.addEventListener("pointermove", mirar);

  const progresso = () => G.pontos / 100;

  function nascer() {
    const p = progresso();
    const sorte = Math.random();
    let tipo = "coracao";
    const chanceNuvem = G.pontos > 8 ? 0.15 + p * 0.1 : 0;
    if (sorte < chanceNuvem) tipo = "nuvem";
    else if (sorte < chanceNuvem + 0.1) tipo = "ouro";
    else if (sorte < chanceNuvem + 0.14 && G.ima <= 0 && G.pontos > 15 && !G.itens.some((i) => i.tipo === "ima")) tipo = "ima";

    const r = tipo === "nuvem" ? 28 : tipo === "ouro" ? 19 : tipo === "ima" ? 22 : 16 + Math.random() * 5;
    const base = (170 + 240 * p) * escala;
    const fator = tipo === "nuvem" ? 0.72 : tipo === "ima" ? 0.8 : tipo === "ouro" ? 1.15 : 1;
    G.itens.push({
      tipo, r,
      x: r + Math.random() * (W - r * 2),
      y: -r - 8,
      vx: tipo === "nuvem" ? (Math.random() - 0.5) * 70 : 0,
      vy: base * fator * (0.85 + Math.random() * 0.3),
      fase: Math.random() * 6.28,
      cor: ["#ff6f96", "#ff8fb0", "#f45a8a", "#c9a5ff"][Math.floor(Math.random() * 4)]
    });
  }

  function atualizar(dt) {
    G.tempo += dt;
    J.x += (J.tx - J.x) * Math.min(1, dt * (J.triste > 0 ? 8 : 20));
    J.feliz = Math.max(0, J.feliz - dt);
    J.triste = Math.max(0, J.triste - dt);
    J.aperta = Math.max(0, J.aperta - dt * 4);
    J.brilho = Math.max(0, J.brilho - dt * 2);
    G.tremor = Math.max(0, G.tremor - dt);
    G.ima = Math.max(0, G.ima - dt);

    if (G.comecou && !G.fim) {
      G.acc += dt;
      const intervalo = 0.78 - 0.36 * progresso();
      while (G.acc > intervalo) { G.acc -= intervalo; nascer(); }
    }

    const boca = J.y - J.h / 2;
    for (let i = G.itens.length - 1; i >= 0; i--) {
      const it = G.itens[i];
      it.fase += dt * 3;
      const atraido = G.ima > 0 && (it.tipo === "coracao" || it.tipo === "ouro") && it.y < boca;
      if (atraido) it.vx += ((J.x - it.x) * 9 - it.vx * 3) * dt;
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if (it.tipo === "nuvem" && (it.x < it.r || it.x > W - it.r)) it.vx *= -1;
      it.vis = it.tipo === "nuvem" || atraido ? it.x : it.x + Math.sin(it.fase) * 10;

      if (G.fim) { it.y += 300 * dt; }
      else if (Math.abs(it.vis - J.x) < J.w / 2 + it.r * 0.4 && it.y + it.r * 0.6 > boca && it.y < boca + 30) {
        pegar(it);
        G.itens.splice(i, 1);
        continue;
      }
      if (it.y - it.r > H) {
        if (!G.fim && (it.tipo === "coracao" || it.tipo === "ouro") && G.combo > 0) { G.combo = 0; atualizarCombo(); }
        G.itens.splice(i, 1);
      }
    }

    for (let i = G.parts.length - 1; i >= 0; i--) {
      const p = G.parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 520 * dt;
      p.vida -= dt * 1.4;
      if (p.vida <= 0) G.parts.splice(i, 1);
    }
    for (let i = G.textos.length - 1; i >= 0; i--) {
      const t = G.textos[i];
      t.y -= 50 * dt;
      t.vida -= dt * 1.1;
      if (t.vida <= 0) G.textos.splice(i, 1);
    }

    if (G.fim && !G.mostrouVitoria && !G.bilheteAtivo && !G.fila.length) {
      G.mostrouVitoria = true;
      setTimeout(mostrarVitoria, 500);
    }
  }

  function pegar(it) {
    const x = it.vis, y = it.y;
    if (it.tipo === "nuvem") {
      J.triste = 1.3;
      G.tremor = 0.3;
      G.combo = 0;
      atualizarCombo();
      explodir(x, y, "#9fc4ff", 12, "gota");
      flutuar(x, y - 24, TEXTOS.nuvem, "#8a7f9c");
      nota(220, 0.35, 0.06, "triangle");
      nota(185, 0.45, 0.05, "triangle", 0.12);
      vibrar([25, 40, 25]);
      return;
    }
    if (it.tipo === "ima") {
      G.ima = 5;
      J.feliz = 1;
      J.aperta = 1;
      explodir(x, y, "#c9b6ff", 18, "brilho");
      flutuar(x, y - 24, TEXTOS.presente, "#9b74f0");
      arpejo([659.25, 783.99, 987.77, 1318.51], 0.06, 0.4);
      vibrar(30);
      return;
    }
    G.combo++;
    G.pegos++;
    G.maiorCombo = Math.max(G.maiorCombo, G.combo);
    const ganho = it.tipo === "ouro" ? 10 : 3 + Math.min(G.combo - 1, 4);
    J.feliz = 0.7;
    J.aperta = 1;
    J.brilho = 1;
    explodir(x, y, it.tipo === "ouro" ? "#ffc24a" : it.cor, it.tipo === "ouro" ? 18 : 10, it.tipo === "ouro" ? "brilho" : "coracao");
    flutuar(x, y - 26, "+" + ganho, it.tipo === "ouro" ? "#e09a10" : "#e04d79");
    nota(ESCALA[Math.min(G.combo - 1, ESCALA.length - 1)], 0.32, 0.08);
    if (it.tipo === "ouro") nota(1567.98, 0.5, 0.05, "sine", 0.07);
    vibrar(it.tipo === "ouro" ? 25 : 10);
    atualizarCombo();
    somar(ganho);
  }

  function somar(n) {
    G.pontos = Math.min(100, G.pontos + n);
    while (G.desbloq < FRASES.length - 1 && G.pontos >= (G.desbloq + 1) * 10) {
      G.fila.push(G.desbloq);
      G.desbloq++;
    }
    proximoBilhete();
    atualizarMedidor();
    if (G.pontos >= 100 && !G.fim) {
      G.fim = true;
      J.feliz = 99;
      chuva(36);
      arpejo([523.25, 659.25, 783.99, 1046.5, 1318.51], 0.12, 0.8);
      vibrar([40, 60, 40, 60, 80]);
    }
  }

  function proximoBilhete() {
    if (G.bilheteAtivo || !G.fila.length) return;
    const i = G.fila.shift();
    const jogo = G;
    jogo.bilheteAtivo = true;
    const el = $("bilhete");
    $("bilhete-n").textContent = preencher(TEXTOS.bilheteNumero, { n: i + 1, total: FRASES.length });
    $("bilhete-t").textContent = FRASES[i];
    el.classList.remove("sai");
    el.hidden = false;
    void el.offsetWidth;
    el.classList.add("entra");
    arpejo([1046.5, 1318.51], 0.08, 0.6);
    const tempo = Math.max(2300, 1300 + FRASES[i].length * 38);
    setTimeout(() => {
      if (G !== jogo) return;
      el.classList.remove("entra");
      el.classList.add("sai");
      setTimeout(() => {
        if (G !== jogo) return;
        el.hidden = true;
        el.classList.remove("sai");
        jogo.bilheteAtivo = false;
        proximoBilhete();
      }, 300);
    }, jogo.fim ? Math.min(tempo, 2000) : tempo);
  }

  function atualizarMedidor() {
    const pct = Math.round(G.pontos);
    $("medidor").style.width = pct + "%";
    $("pct").textContent = pct + "%";
  }
  function atualizarCombo() {
    const el = $("combo");
    el.textContent = "combo x" + G.combo;
    el.classList.toggle("on", G.combo >= 3);
    el.classList.toggle("quente", G.combo >= 6);
  }

  function mostrarVitoria() {
    $("vit-frase").textContent = FRASES[FRASES.length - 1];
    $("vit-info").textContent = preencher(TEXTOS.vitoriaResumo, { coracoes: G.pegos, combo: G.maiorCombo });
    $("vitoria").hidden = false;
  }

  function explodir(x, y, cor, qtd, tipo) {
    for (let i = 0; i < qtd; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 80 + Math.random() * 200;
      G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vida: 1, cor, tipo, r: 4 + Math.random() * 4 });
    }
  }
  function flutuar(x, y, txt, cor) {
    G.textos.push({ x: Math.max(50, Math.min(W - 50, x)), y, txt, cor, vida: 1 });
  }

  /* ---------- Desenho ---------- */
  function caminhoCoracao(r) {
    cx.beginPath();
    cx.moveTo(0, r * 0.95);
    cx.bezierCurveTo(-r * 1.35, r * 0.1, -r * 1.05, -r * 1.05, 0, -r * 0.45);
    cx.bezierCurveTo(r * 1.05, -r * 1.05, r * 1.35, r * 0.1, 0, r * 0.95);
    cx.closePath();
  }
  function coracao(x, y, r, cor, giro = 0) {
    cx.save();
    cx.translate(x, y);
    cx.rotate(giro);
    caminhoCoracao(r);
    cx.fillStyle = cor;
    cx.fill();
    cx.beginPath();
    cx.ellipse(-r * 0.42, -r * 0.35, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2);
    cx.fillStyle = "rgba(255,255,255,.7)";
    cx.fill();
    cx.restore();
  }
  function estrela(x, y, r, cor) {
    cx.save();
    cx.translate(x, y);
    cx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? r * 0.35 : r;
      const a = (i / 8) * Math.PI * 2;
      cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    cx.closePath();
    cx.fillStyle = cor;
    cx.fill();
    cx.restore();
  }
  function nuvem(x, y, r, t) {
    cx.save();
    cx.translate(x, y);
    cx.fillStyle = "#d9d3e3";
    cx.beginPath();
    cx.arc(-r * 0.55, r * 0.1, r * 0.48, 0, Math.PI * 2);
    cx.arc(0, -r * 0.2, r * 0.62, 0, Math.PI * 2);
    cx.arc(r * 0.58, r * 0.1, r * 0.46, 0, Math.PI * 2);
    cx.rect(-r * 0.55, r * 0.1, r * 1.13, r * 0.48);
    cx.fill();
    cx.fillStyle = "#5e3550";
    cx.beginPath();
    cx.arc(-r * 0.25, r * 0.02, 2.4, 0, Math.PI * 2);
    cx.arc(r * 0.25, r * 0.02, 2.4, 0, Math.PI * 2);
    cx.fill();
    cx.strokeStyle = "#5e3550";
    cx.lineWidth = 2;
    cx.lineCap = "round";
    cx.beginPath();
    cx.arc(0, r * 0.32, r * 0.14, Math.PI * 1.15, Math.PI * 1.85);
    cx.stroke();
    cx.fillStyle = "#9fc4ff";
    const g = (t * 60) % 14;
    cx.beginPath();
    cx.ellipse(-r * 0.3, r * 0.75 + g, 2, 3.5, 0, 0, Math.PI * 2);
    cx.ellipse(r * 0.3, r * 0.75 + ((g + 7) % 14), 2, 3.5, 0, 0, Math.PI * 2);
    cx.fill();
    cx.restore();
  }
  function presente(x, y, r, t) {
    cx.save();
    cx.translate(x, y);
    cx.strokeStyle = "rgba(201,182,255," + (0.35 + Math.sin(t * 6) * 0.25) + ")";
    cx.lineWidth = 3;
    cx.beginPath();
    cx.arc(0, 0, r * 1.45 + Math.sin(t * 6) * 3, 0, Math.PI * 2);
    cx.stroke();
    cx.restore();
    coracao(x, y, r, "#b48cff", Math.sin(t * 4) * 0.15);
    cx.save();
    cx.translate(x, y);
    cx.fillStyle = "#fff";
    cx.fillRect(-2, -r * 0.6, 4, r * 1.45);
    cx.fillRect(-r * 0.95, -2, r * 1.9, 4);
    cx.restore();
  }

  function desenharPote() {
    const { x, y, w, h } = J;
    const ap = J.aperta;
    cx.save();
    cx.translate(x, y + h / 2);
    cx.scale(1 + ap * 0.09, 1 - ap * 0.09);
    cx.translate(0, -h / 2);
    const top = -h / 2, bot = h / 2, hw = w / 2;

    if (G.ima > 0) {
      cx.strokeStyle = "rgba(201,182,255," + (0.3 + Math.sin(G.tempo * 8) * 0.2) + ")";
      cx.lineWidth = 4;
      cx.beginPath();
      cx.arc(0, 0, hw + 18 + Math.sin(G.tempo * 8) * 4, 0, Math.PI * 2);
      cx.stroke();
    }

    const corpo = () => {
      cx.beginPath();
      cx.moveTo(-hw * 0.84, top);
      cx.lineTo(hw * 0.84, top);
      cx.quadraticCurveTo(hw, top + 6, hw, top + 20);
      cx.lineTo(hw, bot - 16);
      cx.quadraticCurveTo(hw, bot, hw - 16, bot);
      cx.lineTo(-hw + 16, bot);
      cx.quadraticCurveTo(-hw, bot, -hw, bot - 16);
      cx.lineTo(-hw, top + 20);
      cx.quadraticCurveTo(-hw, top + 6, -hw * 0.84, top);
      cx.closePath();
    };

    cx.shadowColor = "rgba(255,111,150,.55)";
    cx.shadowBlur = 8 + J.brilho * 26;
    corpo();
    cx.fillStyle = "rgba(255,255,255,.78)";
    cx.fill();
    cx.shadowBlur = 0;

    // amor enchendo o potinho
    const nivel = (G.pontos / 100) * (h - 8);
    if (nivel > 0) {
      cx.save();
      corpo();
      cx.clip();
      const sup = bot - nivel;
      const grad = cx.createLinearGradient(0, sup, 0, bot);
      grad.addColorStop(0, "#ff8fb0");
      grad.addColorStop(1, "#c9b6ff");
      cx.fillStyle = grad;
      cx.beginPath();
      cx.moveTo(-hw - 2, bot + 2);
      for (let i = 0; i <= 12; i++) {
        const px = -hw - 2 + (i / 12) * (w + 4);
        cx.lineTo(px, sup + Math.sin(G.tempo * 4 + i * 0.9) * 2.5);
      }
      cx.lineTo(hw + 2, bot + 2);
      cx.closePath();
      cx.fill();
      cx.restore();
    }

    corpo();
    cx.strokeStyle = "#ffb3c8";
    cx.lineWidth = 3;
    cx.stroke();

    // reflexo do vidro
    cx.strokeStyle = "rgba(255,255,255,.9)";
    cx.lineWidth = 4;
    cx.lineCap = "round";
    cx.beginPath();
    cx.moveTo(-hw + 11, top + 24);
    cx.lineTo(-hw + 11, top + 40);
    cx.stroke();

    // tampinha com laço
    cx.fillStyle = "#ff8fb0";
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(-hw * 0.92, top - 13, w * 0.92, 14, 7);
    else cx.rect(-hw * 0.92, top - 13, w * 0.92, 14);
    cx.fill();
    coracao(0, top - 7, 7, "#fff");

    // carinha
    const fy = top + h * 0.42;
    cx.fillStyle = "#5e3550";
    cx.strokeStyle = "#5e3550";
    cx.lineWidth = 3;
    if (J.triste > 0) {
      cx.beginPath();
      cx.arc(-15, fy, 3.5, 0, Math.PI * 2);
      cx.arc(15, fy, 3.5, 0, Math.PI * 2);
      cx.fill();
      cx.beginPath();
      cx.arc(0, fy + 15, 7, Math.PI * 1.15, Math.PI * 1.85);
      cx.stroke();
      cx.fillStyle = "#9fc4ff";
      cx.beginPath();
      cx.ellipse(19, fy + 9 + (1.3 - J.triste) * 10, 2.5, 4, 0, 0, Math.PI * 2);
      cx.fill();
    } else if (J.feliz > 0) {
      cx.beginPath();
      cx.arc(-15, fy + 2, 5, Math.PI * 1.1, Math.PI * 1.9);
      cx.stroke();
      cx.beginPath();
      cx.arc(15, fy + 2, 5, Math.PI * 1.1, Math.PI * 1.9);
      cx.stroke();
      cx.beginPath();
      cx.arc(0, fy + 6, 7, 0, Math.PI);
      cx.closePath();
      cx.fill();
    } else {
      const pisca = G.tempo % 3.4 < 0.12;
      cx.beginPath();
      if (pisca) {
        cx.fillRect(-19, fy - 1, 8, 2.5);
        cx.fillRect(11, fy - 1, 8, 2.5);
      } else {
        cx.arc(-15, fy, 4, 0, Math.PI * 2);
        cx.arc(15, fy, 4, 0, Math.PI * 2);
        cx.fill();
      }
      cx.beginPath();
      cx.arc(0, fy + 7, 6, 0.15 * Math.PI, 0.85 * Math.PI);
      cx.stroke();
    }
    cx.fillStyle = "rgba(255,143,176,.55)";
    cx.beginPath();
    cx.ellipse(-27, fy + 9, 6, 3.5, 0, 0, Math.PI * 2);
    cx.ellipse(27, fy + 9, 6, 3.5, 0, 0, Math.PI * 2);
    cx.fill();

    cx.restore();
  }

  function desenhar() {
    cx.clearRect(0, 0, W, H);
    cx.save();
    if (G.tremor > 0) {
      const k = G.tremor * 14;
      cx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
    }

    for (const it of G.itens) {
      const x = it.vis ?? it.x;
      if (it.tipo === "nuvem") nuvem(x, it.y, it.r, G.tempo);
      else if (it.tipo === "ima") presente(x, it.y, it.r, G.tempo);
      else if (it.tipo === "ouro") {
        coracao(x, it.y, it.r, "#ffc24a", Math.sin(it.fase) * 0.2);
        estrela(x + it.r * 0.9, it.y - it.r * 0.8, 6 + Math.sin(G.tempo * 10) * 2, "#fff3c4");
      } else coracao(x, it.y, it.r, it.cor, Math.sin(it.fase) * 0.15);
    }

    desenharPote();

    for (const p of G.parts) {
      cx.globalAlpha = Math.max(0, p.vida);
      if (p.tipo === "gota") {
        cx.fillStyle = p.cor;
        cx.beginPath();
        cx.ellipse(p.x, p.y, 2.5, 4, 0, 0, Math.PI * 2);
        cx.fill();
      } else if (p.tipo === "brilho") estrela(p.x, p.y, p.r + 1, p.cor);
      else coracao(p.x, p.y, p.r, p.cor);
    }
    cx.globalAlpha = 1;

    cx.textAlign = "center";
    cx.font = "700 22px Fredoka, Nunito, system-ui, sans-serif";
    cx.lineWidth = 5;
    cx.lineJoin = "round";
    for (const t of G.textos) {
      cx.globalAlpha = Math.max(0, Math.min(1, t.vida * 1.6));
      cx.strokeStyle = "#fffdf9";
      cx.strokeText(t.txt, t.x, t.y);
      cx.fillStyle = t.cor;
      cx.fillText(t.txt, t.x, t.y);
    }
    cx.globalAlpha = 1;
    cx.restore();
  }

    chuva(60);
    arpejo([523.25, 659.25, 783.99, 659.25, 1046.5], 0.16, 0.9);
    vibrar([60, 80, 120]);
    $("abraco").textContent = TEXTOS.abracoMensagem;
    $("btn-abraco").textContent = TEXTOS.abracoDeNovo;
  });
  $("btn-denovo").addEventListener("click", () => {
    irPara("tela-jogo");
    novoJogo();
  });
