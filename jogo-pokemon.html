<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2b3d">
<title>Aventura Pokémon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:auto; touch-action:none; overscroll-behavior:none; }
  body {
    background: radial-gradient(circle at 50% 30%, #3a3a52 0%, #23232f 70%);
    font-family: 'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- console (carcaça) ---------- */
  #shell {
    background: linear-gradient(160deg, #4a4a68, #34344a 60%, #2b2b3d);
    border-radius: 18px 18px 48px 18px;
    padding: 14px 14px 18px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
    display:flex; flex-direction:column; gap:10px;
    margin:auto;
  }
  #brand {
    color:#9a9ab8; font-size:11px; font-weight:bold; letter-spacing:3px;
    text-align:center; text-shadow:0 1px 0 rgba(0,0,0,.6);
  }
  #bezel {
    background:#1a1a24; border-radius:10px; padding:12px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.8);
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  #led {
    position:absolute; top:10px; left:10px; width:7px; height:7px; border-radius:50%;
    background:#ff4d4d; box-shadow:0 0 6px #ff4d4d;
  }
  #screenwrap { position:relative; line-height:0; }
  canvas#tela {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background:#88c070; border-radius:3px;
  }

  /* ---------- caixa de diálogo ---------- */
  #dialog {
    position:absolute; left:2%; right:2%; bottom:3%;
    background:#f8f8f0; color:#202030;
    border:3px solid #202030; border-radius:6px;
    box-shadow: inset 0 0 0 2px #f8f8f0, inset 0 0 0 4px #7890a8;
    padding:7px 9px; min-height:34%;
    font-weight:bold; line-height:1.35;
    display:none; white-space:pre-wrap;
  }
  #dialog.aberto { display:block; }
  #seta {
    position:absolute; right:8px; bottom:4px; color:#c03028;
    animation: pisca .6s steps(1) infinite;
  }
  @keyframes pisca { 50% { opacity:0; } }

  /* ---------- tela de título ---------- */
  #titulo {
    position:absolute; inset:0; border-radius:3px;
    background: linear-gradient(#f8e8a0 0 62%, #78c850 62% 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; text-align:center; z-index:5;
  }
  #titulo h1 {
    color:#c03028; letter-spacing:1px; line-height:1.1;
    text-shadow: 2px 2px 0 #f8d030, 4px 4px 0 rgba(32,32,48,.35);
  }
  #titulo .sub { color:#385028; font-weight:bold; }
  #titulo .start { color:#202030; font-weight:bold; animation:pisca 1s steps(1) infinite; }
  #bola {
    width:34px; height:34px; border-radius:50%;
    background: linear-gradient(#e04838 0 45%, #202030 45% 55%, #f8f8f0 55% 100%);
    border:3px solid #202030; position:relative;
  }
  #bola::after {
    content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:9px; height:9px; border-radius:50%; background:#f8f8f0; border:3px solid #202030;
  }

  /* ---------- cena final ---------- */
  #cena {
    position:absolute; inset:0; border-radius:3px; z-index:6;
    background: radial-gradient(circle at 50% 35%, #3a1428 0%, #14060e 75%);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:6%; text-align:center; padding:6%;
    opacity:0; transition: opacity 1.2s ease;
  }
  #cena.aberta { display:flex; }
  #cena.visivel { opacity:1; }
  #coracao-grande {
    width:32%; image-rendering:pixelated;
    animation: batida 1s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(232,120,160,.5));
  }
  @keyframes batida { 50% { transform:scale(1.14); } }
  @media (prefers-reduced-motion: reduce) {
    #coracao-grande, #seta, #titulo .start { animation:none; }
  }
  #pergunta { color:#f8d0e0; font-weight:bold; line-height:1.4; white-space:pre-wrap; }
  #botoes { display:flex; flex-direction:column; gap:10px; width:70%; }
  #botoes button {
    font-family:inherit; font-weight:bold; font-size:inherit;
    background:#f8f8f0; color:#202030; border:3px solid #202030; border-radius:6px;
    box-shadow: inset 0 0 0 2px #f8f8f0, inset 0 0 0 4px #e878a0, 0 3px 0 #6a2040;
    padding:6% 4%; cursor:pointer;
  }
  #botoes button:active { transform:translateY(2px); box-shadow: inset 0 0 0 2px #f8f8f0, inset 0 0 0 4px #e878a0; }
  #resposta { color:#f8d0e0; font-weight:bold; line-height:1.5; white-space:pre-wrap; display:none; }
  #confete { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---------- controles ---------- */
  #controles { display:flex; align-items:center; justify-content:space-between; padding:0 6px; }
  #dpad {
    position:relative; width:118px; height:118px; flex:none;
  }
  .dbtn {
    position:absolute; width:40px; height:40px; background:#23232f;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
    color:#8a8aa8; font-size:15px;
  }
  .dbtn:active, .dbtn.on { background:#191922; transform:translateY(1px); }
  #d-up    { left:39px; top:0;    border-radius:8px 8px 0 0; }
  #d-down  { left:39px; top:78px; border-radius:0 0 8px 8px; }
  #d-left  { left:0;    top:39px; border-radius:8px 0 0 8px; }
  #d-right { left:78px; top:39px; border-radius:0 8px 8px 0; }
  #d-mid   { left:39px; top:39px; border-radius:0; }
  #abtns { display:flex; gap:14px; align-items:flex-end; flex:none; transform:rotate(-18deg); }
  .rbtn {
    width:52px; height:52px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d05a6a, #a02838);
    border:none; color:#ffd9de; font-weight:bold; font-size:16px;
    font-family:inherit;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), 0 3px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .rbtn:active { transform:translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
  .rbtn span { pointer-events:none; }
  #dica {
    color:#7a7a98; font-size:10px; text-align:center; letter-spacing:1px;
  }

  /* paisagem: controles ao lado da tela */
  @media (orientation: landscape) and (max-height: 520px) {
    #shell { flex-direction:row; align-items:center; border-radius:24px; gap:16px; }
    #brand, #dica { display:none; }
    #controles { flex-direction:column; gap:18px; padding:0; }
    #abtns { transform:rotate(0); }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="brand">POCKET AVENTURA ・ COLOR</div>
  <div id="bezel">
    <div id="led"></div>
    <div id="screenwrap">
      <canvas id="tela" width="160" height="144"></canvas>
      <div id="titulo">
        <div id="bola"></div>
        <h1>AVENTURA<br>POKÉMON</h1>
        <div class="sub" id="subtitulo">Edição Especial</div>
        <div class="start">PRESSIONE A</div>
      </div>
      <div id="dialog"><span id="dtexto"></span><span id="seta">▼</span></div>
      <div id="cena">
        <canvas id="coracao-grande" width="13" height="11"></canvas>
        <div id="pergunta"></div>
        <div id="botoes">
          <button id="b-sim1"></button>
          <button id="b-sim2"></button>
        </div>
        <div id="resposta"></div>
        <canvas id="confete"></canvas>
      </div>
    </div>
  </div>
  <div id="controles">
    <div id="dpad">
      <div class="dbtn" id="d-up"    data-dir="up">▲</div>
      <div class="dbtn" id="d-left"  data-dir="left">◀</div>
      <div class="dbtn" id="d-mid"></div>
      <div class="dbtn" id="d-right" data-dir="right">▶</div>
      <div class="dbtn" id="d-down"  data-dir="down">▼</div>
    </div>
    <div id="abtns">
      <button class="rbtn" id="btn-b"><span>B</span></button>
      <button class="rbtn" id="btn-a"><span>A</span></button>
    </div>
  </div>
  <div id="dica">A: FALAR / OK &nbsp;・&nbsp; B: CORRER</div>
</div>

function espelhar(grid){ return grid.map(l => l.split('').reverse().join('')); }

function pintarGrade(g, grid, ox, oy, troca){
  for (let y = 0; y < grid.length; y++){
    const linha = grid[y];
    for (let x = 0; x < linha.length; x++){
      let ch = linha[x];
      if (ch === '.') continue;
      if (troca && troca[ch]) ch = troca[ch];
      g.fillStyle = PAL[ch] || ch;   // aceita cor direta ('#123456') na troca
      g.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}
function fazerSprite(grid, troca){
  const c = document.createElement('canvas');
  c.width = TAM; c.height = TAM;
  pintarGrade(c.getContext('2d'), grid, 0, 0, troca);
  return c;
}

/* ---------- tiles desenhados em código ---------- */
function novoTile(desenho){
  const c = document.createElement('canvas');
  c.width = TAM; c.height = TAM;
  desenho(c.getContext('2d'));
  return c;
}
function baseGrama(g){
  g.fillStyle = '#78b850'; g.fillRect(0,0,16,16);
  g.fillStyle = '#68a844';
  [[2,3],[7,1],[12,4],[4,9],[10,8],[14,11],[1,13],[8,13],[13,14],[5,6]]
    .forEach(([x,y]) => { g.fillRect(x,y,2,1); g.fillRect(x,y+1,1,1); });
}
const TILES = {
  G: novoTile(baseGrama),
  P: novoTile(g => {
    g.fillStyle = '#e0c078'; g.fillRect(0,0,16,16);
    g.fillStyle = '#c8a860';
    [[3,2],[9,5],[13,1],[2,8],[7,10],[12,12],[5,14],[14,9]]
      .forEach(([x,y]) => g.fillRect(x,y,2,2));
    g.fillStyle = '#d4b46c'; g.fillRect(0,0,16,1);

    baseGrama(g);
    g.fillStyle = '#3e8c3e';
    for (let i = 0; i < 4; i++){
      const x = i*4;
      g.fillRect(x,6,1,8); g.fillRect(x+1,4,1,10);
      g.fillRect(x+2,7,1,7); g.fillRect(x+3,5,1,9);
    }
    g.fillStyle = '#57a04c';
    for (let i = 0; i < 4; i++){ g.fillRect(i*4+1,4,1,3); g.fillRect(i*4+3,5,1,3); }
  }),
  W: [
    novoTile(g => {
      g.fillStyle = '#4890d8'; g.fillRect(0,0,16,16);
      g.fillStyle = '#3878c0'; g.fillRect(0,0,16,2);
      g.fillStyle = '#90c8f0';
      g.fillRect(2,4,4,1); g.fillRect(9,7,4,1); g.fillRect(4,11,4,1); g.fillRect(11,13,3,1);
    }),
    novoTile(g => {
      g.fillStyle = '#4890d8'; g.fillRect(0,0,16,16);
      g.fillStyle = '#3878c0'; g.fillRect(0,0,16,2);
      g.fillStyle = '#90c8f0';
      g.fillRect(4,5,4,1); g.fillRect(7,8,4,1); g.fillRect(2,12,4,1); g.fillRect(10,3,3,1);
    })
  ],
  F: [
    novoTile(g => {
      baseGrama(g);
      g.fillStyle = '#e04838';
      g.fillRect(6,3,2,2); g.fillRect(4,5,2,2); g.fillRect(8,5,2,2); g.fillRect(6,7,2,2);
      g.fillStyle = '#f8d030'; g.fillRect(6,5,2,2);
      g.fillStyle = '#f8f8f0'; g.fillRect(11,10,2,2); g.fillRect(2,11,2,2);
    }),
    novoTile(g => {
      baseGrama(g);
      g.fillStyle = '#e04838';
      g.fillRect(5,4,2,2); g.fillRect(9,4,2,2); g.fillRect(5,8,2,2); g.fillRect(9,8,2,2);
      g.fillStyle = '#f8d030'; g.fillRect(7,6,2,2);
      g.fillStyle = '#f8f8f0'; g.fillRect(12,11,2,2); g.fillRect(3,10,2,2);
    })
  ],
  S: novoTile(g => {
    baseGrama(g);
    g.fillStyle = '#181820'; g.fillRect(2,2,12,8);
    g.fillStyle = '#a06a32'; g.fillRect(3,3,10,6);
    g.fillStyle = '#7a4e22'; g.fillRect(4,4,8,1); g.fillRect(4,6,8,1);
    g.fillStyle = '#181820'; g.fillRect(6,10,4,5);
    g.fillStyle = '#7a4e22'; g.fillRect(7,10,2,5);
  }),
  X: novoTile(g => {
    baseGrama(g);
    g.fillStyle = '#181820'; g.fillRect(0,4,16,4); g.fillRect(2,2,3,12); g.fillRect(11,2,3,12);
    g.fillStyle = '#a06a32'; g.fillRect(0,5,16,2); g.fillRect(3,3,1,10); g.fillRect(12,3,1,10);
    g.fillStyle = '#c08848'; g.fillRect(3,3,1,2); g.fillRect(12,3,1,2);
  })
};
TILES.Z = TILES.S;
TILES.H = [
  novoTile(g => { baseGrama(g); pintarGrade(g, CORACAO_9, 3, 3); }),
  novoTile(g => { baseGrama(g); pintarGrade(g, CORACAO_9, 3, 4); })
];

/* sobreposição do mato alto (metade de baixo) para a jogadora "afundar" nele */
const MATO_TOPO = novoTile(g => {
  g.clearRect(0,0,16,16);
  g.fillStyle = '#3e8c3e';
  for (let i = 0; i < 4; i++){
    const x = i*4;
    g.fillRect(x,9,1,7); g.fillRect(x+1,8,1,8); g.fillRect(x+2,10,1,6); g.fillRect(x+3,9,1,7);
  }
});

/* ---------- estado do jogo ---------- */
const mapa = MAPA_RAW.map(l => l.split(''));
const MAPA_H = mapa.length, MAPA_W = mapa[0].length;

let npc = null, ele = null;
const coracoes = [];
const jogador = {
  x: 2, y: 2, px: 32, py: 32,
  dir: 'down', andando: false, prog: 0, passos: 0, cdEncontro: 0
};
for (let y = 0; y < MAPA_H; y++)
  for (let x = 0; x < MAPA_W; x++){
    const c = mapa[y][x];
    if (c === 'N'){ npc = {x, y}; mapa[y][x] = 'F'; }
    if (c === 'M'){ ele = {x, y}; mapa[y][x] = 'F'; }
    if (c === 'H'){ coracoes.push({x, y, pego:false}); mapa[y][x] = 'G'; }
    if (c === '@'){ jogador.x = x; jogador.y = y; mapa[y][x] = 'P'; }
  }
jogador.px = jogador.x * TAM; jogador.py = jogador.y * TAM;
const TOTAL_CORACOES = coracoes.length;
const achados = () => coracoes.filter(c => c.pego).length;

const bichinho = {
  x: jogador.x - 1, y: jogador.y,
  px: (jogador.x - 1) * TAM, py: jogador.y * TAM,
  andando: false, prog: 0, alvoX: 0, alvoY: 0
};

const SOLIDO = new Set(['R','W','X','S','Z']);
function tile(x, y){
  if (x < 0 || y < 0 || x >= MAPA_W || y >= MAPA_H) return 'R';
  return mapa[y][x];
}
function bloqueado(x, y){
  if (SOLIDO.has(tile(x, y))) return true;
  if (npc && npc.x === x && npc.y === y) return true;
  if (ele && ele.x === x && ele.y === y) return true;
  return false;
}

/* ---------- áudio (bipes retrô) ---------- */
let actx = null;
function bip(freq, dur, tipo, vol){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), ga = actx.createGain();
    o.type = tipo || 'square'; o.frequency.value = freq;
    ga.gain.setValueAtTime(vol || .04, actx.currentTime);
    ga.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(ga); ga.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}
const somOk    = () => bip(880, .07);
const somBump  = () => bip(90,  .08, 'triangle', .06);
const somItem  = () => { bip(660,.09); setTimeout(()=>bip(880,.09),90); setTimeout(()=>bip(1180,.16),180); };
function tocarMelodia(){
  const notas = [[659.25,.3],[783.99,.3],[1046.5,.45],[880,.3],[987.77,.3],[1318.5,.6],[1046.5,.9]];
  let t = 0;
  notas.forEach(([f,d]) => {
    setTimeout(() => { bip(f, d, 'triangle', .055); bip(f/2, d, 'sine', .03); }, t*1000);
    t += d * .92;
  });
}
function fanfarra(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=> setTimeout(()=>bip(f,.22,'triangle',.06), i*110));
}

/* ---------- caixa de diálogo ---------- */
const elDialog = document.getElementById('dialog');
const elTexto  = document.getElementById('dtexto');
const elSeta   = document.getElementById('seta');
const dlg = { aberto:false, paginas:[], pag:0, pos:0, timer:null, aoFechar:null };

function abrirDialogo(paginas, aoFechar){
  dlg.aberto = true; dlg.paginas = paginas.map(aplicarNome); dlg.pag = 0;
  dlg.aoFechar = aoFechar || null;
  elDialog.classList.add('aberto');
  digitar();
}
function digitar(){
  clearInterval(dlg.timer);
  dlg.pos = 0; elTexto.textContent = ''; elSeta.style.display = 'none';
  const texto = dlg.paginas[dlg.pag];
  dlg.timer = setInterval(() => {
    dlg.pos++;
    elTexto.textContent = texto.slice(0, dlg.pos);
    if (dlg.pos >= texto.length){
      clearInterval(dlg.timer);
      elSeta.style.display = 'inline';
    }
  }, 28);
}
function avancarDialogo(){
  const texto = dlg.paginas[dlg.pag];
  if (dlg.pos < texto.length){          // pular a digitação
    clearInterval(dlg.timer);
    dlg.pos = texto.length;
    elTexto.textContent = texto;
    elSeta.style.display = 'inline';
    return;
  }
  somOk();
  if (dlg.pag < dlg.paginas.length - 1){ dlg.pag++; digitar(); }
  else {
    dlg.aberto = false; elDialog.classList.remove('aberto');
    const cb = dlg.aoFechar; dlg.aoFechar = null;
    if (cb) cb();
  }
}

/* ---------- cena final ---------- */
let cenaAberta = false, respondido = false;
const elCena = document.getElementById('cena');
function iniciarCena(){
  cenaAberta = true;
  document.getElementById('pergunta').textContent = aplicarNome(CONFIG.pergunta);
  document.getElementById('b-sim1').textContent = CONFIG.botao1;
  document.getElementById('b-sim2').textContent = CONFIG.botao2;
  elCena.classList.add('aberta');
  requestAnimationFrame(() => elCena.classList.add('visivel'));
  tocarMelodia();
}
function responder(){
  if (respondido) return;
  respondido = true;
  fanfarra();
  document.getElementById('pergunta').style.display = 'none';
  document.getElementById('botoes').style.display = 'none';
  const r = document.getElementById('resposta');
  r.textContent = aplicarNome(CONFIG.respostaFinal);
  r.style.display = 'block';
  iniciarConfete();
  setTimeout(tocarMelodia, 900);
}
document.getElementById('b-sim1').addEventListener('click', responder);
document.getElementById('b-sim2').addEventListener('click', responder);

function iniciarConfete(){
  const cv = document.getElementById('confete');
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  const g = cv.getContext('2d');
  const cores = ['#e878a0','#e04838','#f8d030','#78c8f8','#f8f8f0'];
  const pts = Array.from({length: 60}, () => ({
    x: Math.random()*cv.width, y: -Math.random()*cv.height,
    vy: 40 + Math.random()*80, vx: -20 + Math.random()*40,
    tam: 3 + Math.random()*4, cor: cores[Math.floor(Math.random()*cores.length)]
  }));
  let ant = performance.now();
  (function anima(t){
    if (!cenaAberta) return;
    const dt = Math.min((t - ant)/1000, .05); ant = t;
    g.clearRect(0,0,cv.width,cv.height);
    pts.forEach(p => {
      p.y += p.vy*dt; p.x += p.vx*dt;
      if (p.y > cv.height){ p.y = -10; p.x = Math.random()*cv.width; }
      g.fillStyle = p.cor;
      g.fillRect(Math.round(p.x), Math.round(p.y), p.tam, p.tam);
    });
    requestAnimationFrame(anima);
  })(ant);
}

/* ---------- ações ---------- */
function acaoA(){
  if (telaTitulo){ fecharTitulo(); return; }
  if (cenaAberta){ if (!respondido) responder(); return; }
  if (dlg.aberto){ avancarDialogo(); return; }
  const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[jogador.dir];
  const ax = jogador.x + d[0], ay = jogador.y + d[1];
  const t = tile(ax, ay);
  if (npc && npc.x === ax && npc.y === ay){
    somOk();
    abrirDialogo(achados() >= TOTAL_CORACOES ? CONFIG.npcDepois : CONFIG.mensagensNPC);
  }
  else if (ele && ele.x === ax && ele.y === ay){
    somOk();
    if (respondido) abrirDialogo(CONFIG.eleDepois);
    else if (achados() >= TOTAL_CORACOES) abrirDialogo(CONFIG.eleFinal, iniciarCena);
    else abrirDialogo([...CONFIG.eleAntes, "Você já encontrou ♥ " + achados() + "/" + TOTAL_CORACOES + ".\nEstou te esperando aqui!"]);
  }
  else if (t === 'S'){ somOk(); abrirDialogo([CONFIG.placa1]); }
  else if (t === 'Z'){ somOk(); abrirDialogo([CONFIG.placa2]); }
}

let telaTitulo = true;
function fecharTitulo(){
  telaTitulo = false;
  document.getElementById('titulo').style.display = 'none';
  somOk();
}
if (CONFIG.nomeDela.trim()){
  const n = CONFIG.nomeDela.trim();
  document.getElementById('subtitulo').textContent =
    'para ' + n.charAt(0).toUpperCase() + n.slice(1) + ' ♥';
}

/* ---------- entrada (teclado + toque) ---------- */
const seguradas = [];        // pilha de direções pressionadas (última vence)
let correndo = false;
function pressionaDir(d){ if (!seguradas.includes(d)) seguradas.push(d); }
function soltaDir(d){ const i = seguradas.indexOf(d); if (i >= 0) seguradas.splice(i,1); }

const TECLAS = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
};
addEventListener('keydown', e => {
  if (TECLAS[e.key]){ pressionaDir(TECLAS[e.key]); e.preventDefault(); }
  else if (['z','Z','Enter',' '].includes(e.key)){ if (!e.repeat) acaoA(); e.preventDefault(); }
  else if (['x','X','Shift'].includes(e.key)) correndo = true;
});
addEventListener('keyup', e => {
  if (TECLAS[e.key]) soltaDir(TECLAS[e.key]);
  if (['x','X','Shift'].includes(e.key)) correndo = false;
});

document.querySelectorAll('.dbtn[data-dir]').forEach(btn => {
  const d = btn.dataset.dir;
  const baixo = e => { e.preventDefault(); btn.classList.add('on'); pressionaDir(d); };
  const cima  = e => { e.preventDefault(); btn.classList.remove('on'); soltaDir(d); };
  btn.addEventListener('pointerdown', baixo);
  btn.addEventListener('pointerup', cima);
  btn.addEventListener('pointercancel', cima);
  btn.addEventListener('pointerleave', cima);
});
const btnA = document.getElementById('btn-a');
btnA.addEventListener('pointerdown', e => { e.preventDefault(); acaoA(); });
const btnB = document.getElementById('btn-b');
btnB.addEventListener('pointerdown', e => { e.preventDefault(); correndo = true; });
btnB.addEventListener('pointerup',   () => correndo = false);
btnB.addEventListener('pointercancel',() => correndo = false);
document.getElementById('titulo').addEventListener('pointerdown', fecharTitulo);
elDialog.addEventListener('pointerdown', e => { e.preventDefault(); avancarDialogo(); });

/* ---------- atualização ---------- */
let ultBump = 0;
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

function atualizar(dt){
  if (telaTitulo || dlg.aberto || cenaAberta) return;
  const dirAtiva = seguradas[seguradas.length - 1];
  const vel = (correndo ? 2.1 : 1.15) * dt * 60;

  if (!jogador.andando && dirAtiva){
    jogador.dir = dirAtiva;
    const d = DIRS[dirAtiva];
    const nx = jogador.x + d[0], ny = jogador.y + d[1];
    if (!bloqueado(nx, ny)){
      // o bichinho vai para onde a jogadora estava
      if (bichinho.andando){
        bichinho.x = bichinho.alvoX; bichinho.y = bichinho.alvoY;
      }
      bichinho.alvoX = jogador.x; bichinho.alvoY = jogador.y;
      bichinho.andando = true; bichinho.prog = 0;

      jogador.andando = true; jogador.prog = 0;
      jogador.alvoX = nx; jogador.alvoY = ny;
    } else if (performance.now() - ultBump > 350){
      ultBump = performance.now(); somBump();
    }
  }

  if (jogador.andando){
    jogador.prog += vel;
    if (jogador.prog >= TAM){
      jogador.x = jogador.alvoX; jogador.y = jogador.alvoY;
      jogador.px = jogador.x * TAM; jogador.py = jogador.y * TAM;
      jogador.andando = false; jogador.passos++;
      aoCompletarPasso();
    } else {
      const d = DIRS[jogador.dir];
      jogador.px = jogador.x * TAM + d[0] * jogador.prog;
      jogador.py = jogador.y * TAM + d[1] * jogador.prog;
    }
  }

  if (bichinho.andando){
    bichinho.prog += vel;
    if (bichinho.prog >= TAM){
      bichinho.x = bichinho.alvoX; bichinho.y = bichinho.alvoY;
      bichinho.px = bichinho.x * TAM; bichinho.py = bichinho.y * TAM;
      bichinho.andando = false;
    } else {
      const fx = bichinho.alvoX*TAM - bichinho.x*TAM;
      const fy = bichinho.alvoY*TAM - bichinho.y*TAM;
      bichinho.px = bichinho.x*TAM + Math.sign(fx) * Math.min(Math.abs(fx), bichinho.prog);
      bichinho.py = bichinho.y*TAM + Math.sign(fy) * Math.min(Math.abs(fy), bichinho.prog);
    }
  }
}

function aoCompletarPasso(){
  // coração no chão?
  const h = coracoes.find(c => !c.pego && c.x === jogador.x && c.y === jogador.y);
  if (h){
    h.pego = true; somItem();
    const n = achados();
    const paginas = ["♥ Coração encontrado! (" + n + "/" + TOTAL_CORACOES + ")\n\n" + CONFIG.coracoes[coracoes.indexOf(h)]];
    if (n >= TOTAL_CORACOES) paginas.push(CONFIG.todosEncontrados);
    abrirDialogo(paginas);
    return;
  }
  // surpresa no mato alto
  if (jogador.cdEncontro > 0) jogador.cdEncontro--;
  if (tile(jogador.x, jogador.y) === 'T' && jogador.cdEncontro === 0 && Math.random() < .12){
    jogador.cdEncontro = 5;
    bip(300,.12); setTimeout(()=>bip(240,.16),110);
    abrirDialogo([CONFIG.encontros[Math.floor(Math.random()*CONFIG.encontros.length)]]);
  }
}

/* ---------- desenho ---------- */
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
ctx.imageSmoothingEnabled = false;

function desenhar(t){
  const camX = Math.max(0, Math.min(jogador.px - (TELA_W - TAM)/2, MAPA_W*TAM - TELA_W));
  const camY = Math.max(0, Math.min(jogador.py - (TELA_H - TAM)/2, MAPA_H*TAM - TELA_H));
  const cx = Math.round(camX), cy = Math.round(camY);
  const fAgua = Math.floor(t/600) % 2, fFlor = Math.floor(t/500) % 2;

  const x0 = Math.floor(cx/TAM), y0 = Math.floor(cy/TAM);
  for (let ty = y0; ty <= y0 + Math.ceil(TELA_H/TAM); ty++)
    for (let tx = x0; tx <= x0 + Math.ceil(TELA_W/TAM); tx++){
      const c = tile(tx, ty);
      let img = TILES[c] || TILES.G;
      if (c === 'W') img = TILES.W[fAgua];
      if (c === 'F') img = TILES.F[fFlor];
      ctx.drawImage(img, tx*TAM - cx, ty*TAM - cy);
    }

  coracoes.forEach(c => {
    if (!c.pego) ctx.drawImage(TILES.H[fFlor], c.x*TAM - cx, c.y*TAM - cy);
  });
  if (npc) ctx.drawImage(SPRITE_NPC, npc.x*TAM - cx, npc.y*TAM - cy - 2);
  if (ele) ctx.drawImage(SPRITE_ELE, ele.x*TAM - cx, ele.y*TAM - cy - 2);

  const bob = bichinho.andando && (bichinho.prog % 8) < 4 ? 1 : 0;
  ctx.drawImage(SPRITE_BICH, Math.round(bichinho.px) - cx, Math.round(bichinho.py) - cy - 2 - bob);

  const quadro = jogador.andando && (jogador.prog % TAM) < TAM*0.6 ? 1 : 0;
  const spr = SPRITES[jogador.dir][quadro];
  ctx.drawImage(spr, Math.round(jogador.px) - cx, Math.round(jogador.py) - cy - 2);

  if (tile(jogador.x, jogador.y) === 'T' && !jogador.andando)
    ctx.drawImage(MATO_TOPO, jogador.x*TAM - cx, jogador.y*TAM - cy);

  // HUD: contador de corações
  if (!telaTitulo){
    ctx.fillStyle = 'rgba(16,16,32,.45)';
    ctx.fillRect(1, 1, 4 + TOTAL_CORACOES*9, 10);
    for (let i = 0; i < TOTAL_CORACOES; i++)
      ctx.drawImage(i < achados() ? MINI_CHEIO : MINI_VAZIO, 3 + i*9, 3);
  }
}

let tAnt = performance.now();
function laco(t){
  const dt = Math.min((t - tAnt)/1000, .05);
  tAnt = t;
  atualizar(dt);
  desenhar(t);
  requestAnimationFrame(laco);
}
requestAnimationFrame(laco);

/* ---------- escala inteira para ficar nítido ---------- */
function redimensionar(){
  const paisagem = matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
  const folgaW = paisagem ? 260 : 60;
  const folgaH = paisagem ? 70  : 230;
  const escala = Math.max(1, Math.floor(Math.min(
    (innerWidth  - folgaW) / TELA_W,
    (innerHeight - folgaH) / TELA_H
  )));
  tela.style.width  = TELA_W * escala + 'px';
  tela.style.height = TELA_H * escala + 'px';
  const fonte = Math.max(10, Math.round(escala * 5.5));
  elDialog.style.fontSize = fonte + 'px';
  elCena.style.fontSize = fonte + 'px';
  document.getElementById('titulo').style.fontSize = Math.max(8, Math.round(escala*4)) + 'px';
  document.querySelector('#titulo h1').style.fontSize = Math.max(14, Math.round(escala*8)) + 'px';
}
addEventListener('resize', redimensionar);
redimensionar();
</script>
